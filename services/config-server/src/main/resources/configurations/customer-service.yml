server:
  port: 8085
spring:
  data:
    mongodb:
      username: niskuldeep
      password: niskuldeep
      host: localhost
      port: 27017
      database: customer
      authentication-database: admin

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

